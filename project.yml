name: IslandMascot
options:
  bundleIdPrefix: com.islandmascot
  deploymentTarget:
    iOS: "16.2"

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: "minimal"
    IPHONEOS_DEPLOYMENT_TARGET: "16.2"
    TARGETED_DEVICE_FAMILY: "1" # iPhone
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  IslandMascot:
    type: application
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: IslandMascot
    info:
      path: IslandMascot/App/Info.plist
      properties:
        CFBundleDisplayName: "Island Mascot"
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.islandmascot.app
        INFOPLIST_FILE: IslandMascot/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - target: IslandMascotWidget

  IslandMascotWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: IslandMascotWidget
      - path: IslandMascot/Models/MascotModel.swift
      - path: IslandMascot/Models/MascotAttributes.swift
    info:
      path: IslandMascotWidget/Info.plist
      properties:
        CFBundleDisplayName: "Island Mascot Widget"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.islandmascot.app.widget
        INFOPLIST_FILE: IslandMascotWidget/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
