name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Island Mascot IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Application and Widgets
        run: |
          mkdir -p build/ipa/Payload
          
          # Сборка в стандартную директорию DerivedData
          xcodebuild build \
            -project IslandMascot.xcodeproj \
            -scheme IslandMascot \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/derivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          cp -r build/derivedData/Build/Products/Release-iphoneos/IslandMascot.app build/ipa/Payload/
          cd build/ipa
          zip -r -q IslandMascot.ipa Payload
          cd ../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IslandMascot-iOS-IPA
          path: build/ipa/IslandMascot.ipa
          if-no-files-found: error
