name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Island Mascot IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and Archive
        run: |
          mkdir -p build/archive
          mkdir -p build/ipa/Payload
          
          # Сборка под generic iOS без платного сертификата
          xcodebuild archive \
            -project IslandMascot.xcodeproj \
            -scheme IslandMascot \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/archive/IslandMascot.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package into .IPA
        run: |
          # Копируем .app внутрь каталога Payload
          cp -r build/archive/IslandMascot.xcarchive/Products/Applications/IslandMascot.app build/ipa/Payload/
          
          # Упаковываем в готовый .ipa архив
          cd build/ipa
          zip -r -q IslandMascot.ipa Payload
          cd ../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IslandMascot-iOS-IPA
          path: build/ipa/IslandMascot.ipa
          if-no-files-found: error
